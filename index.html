
<script>
"use strict";

const channels = [
  {name:"AzTV",logo:"AzTV",id:"az-tv-azerbaycan-tv-izle"},
  {name:"İctimai TV",logo:"İTV",id:"ictimai-tv-canli-izle"},
  {name:"İdman TV",logo:"İDMAN",id:"idmantv-canli-hd-izle"},
  {name:"CBC Sport",logo:"CBC SPORT",id:"cbc-sport"},
  {name:"ARB 24",logo:"ARB 24",id:"arb-24-az-canli"},
  {name:"Space TV",logo:"SPACE",id:"space-tv-az-canli-izle"},
  {name:"Mədəniyyət TV",logo:"MƏDƏNİYYƏT",id:"medeniyyet-tv-az"},
  {name:"Kanal S",logo:"KANAL S",id:"kanal-s-az"},
  {name:"CBC Azərbaycan",logo:"CBC AZ",id:"cbc-az-tv-cenub-tv-canli"},
  {name:"Baku TV",logo:"BAKU TV",id:"baku-tv-az-canli"},
  {name:"Xəzər TV",logo:"XƏZƏR",id:"xezer-tv-canli-izle"},
  {name:"AZ News TV",logo:"AZ NEWS",id:"az-news-tv-canli"}
];

const grid = document.getElementById("channels");
const screen = document.getElementById("screen");
const now = document.getElementById("now");
const status = document.getElementById("status");

function playChannel(channel, card) {
  screen.src =
    "https://www.ecanlitvizle.live/embed.php?kanal=" +
    encodeURIComponent(channel.id);

  now.textContent = "📺 " + channel.name;
  status.textContent = "Pleyer yüklənir...";

  document.querySelectorAll(".card").forEach(item =>
    item.classList.remove("active")
  );
  card.classList.add("active");

  document.getElementById("player").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function renderChannels() {
  if (!grid) return;

  const search = document.getElementById("search");
  const query = search.value.toLocaleLowerCase("az");

  grid.replaceChildren();

  const filtered = channels.filter(channel =>
    channel.name.toLocaleLowerCase("az").includes(query)
  );

  if (filtered.length === 0) {
    const message = document.createElement("p");
    message.textContent = "Kanal tapılmadı.";
    grid.appendChild(message);
    return;
  }

  filtered.forEach(channel => {
    const card = document.createElement("article");
    card.className = "card";

    const logo = document.createElement("div");
    logo.className = "logo";
    logo.textContent = channel.logo;

    const title = document.createElement("h3");
    title.textContent = channel.name;

    const button = document.createElement("button");
    button.textContent = "▶ İzlə";
    button.addEventListener("click", () =>
      playChannel(channel, card)
    );

    card.append(logo, title, button);
    grid.appendChild(card);
  });
}

document.getElementById("search")
  .addEventListener("input", renderChannels);

renderChannels();
</script>
