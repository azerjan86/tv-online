<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANVAR IPTV</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { 
            color: #ff9800; 
            font-size: 2.5em; 
            margin-bottom: 10px;
        }
        .subtitle { 
            color: #b0b0b0; 
            margin-bottom: 30px; 
            font-size: 1.1em;
        }
        .tv-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 25px; 
            margin-top: 30px; 
        }
        .channel { 
            background: #1e1e1e; 
            padding: 20px 15px; 
            border-radius: 12px; 
            transition: all 0.3s ease; 
            border: 1px solid #333;
            position: relative;
        }
        .channel:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 10px 20px rgba(255, 152, 0, 0.2);
            border-color: #ff9800;
        }
        .channel-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .channel h3 { 
            margin: 0 0 15px 0; 
            color: #fff; 
            font-size: 1.2em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-btn { 
            background: #ff9800; 
            color: #000; 
            border: none; 
            padding: 10px 20px; 
            font-size: 15px; 
            border-radius: 25px; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block;
            font-weight: 600;
            transition: background 0.2s;
        }
        .channel-btn:hover { 
            background: #e68900; 
        }
        #tv-frame {
            width: 100%;
            max-width: 960px;
            height: 540px;
            border-radius: 12px;
            margin: 30px auto 0 auto;
            display: block;
            border: 2px solid #333;
            background: #000;
        }
        .placeholder {
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <h1>Мир телевидения в одном месте</h1>
    <p class="subtitle">ANVAR IPTV — онлайн телевидение Азербайджана</p>
    <p>Выбирай канал. Устраивайся поудобнее. Смотри онлайн.</p>

    <div class="tv-grid">
        <div class="channel">
            <img alt="AzTV" class="channel-logo" id="01a1888c-8dd9-7535-a787-125abad27348">
            <h3>AzTV</h3>
            <a href="#" class="channel-btn" onclick="loadChannel('https://iptv-check.streaming.medianova.com/aztv/aztv.m3u8')">Baxmaq</a>
        </div>
        <div class="channel">
            <img src="https://via.placeholder.com/60/0000FF/FFFFFF?text=1C" alt="Первый канал" class="channel-logo">
            <h3>Первый канал</h3>
            <a href="#" class="channel-btn" onclick="loadChannel('https://peercdn1-1-1-1.live.100pb.tv/play/1kanal/playlist.m3u8')">Смотреть</a>
        </div>
        <div class="channel">
            <img src="https://via.placeholder.com/60/008542/FFFFFF?text=TR" alt="TRT 1" class="channel-logo">
            <h3>TRT 1</h3>
            <a href="#" class="channel-btn" onclick="loadChannel('https://trtizle-live.ercdn.net/trt1/smil:trt1.smil/playlist.m3u8')">İzlemək</a>
        </div>
    </div>

    <div id="player-container">
        <iframe id="tv-frame" allowfullscreen></iframe>
        <p id="placeholder-text" class="placeholder">Нажмите на кнопку «Смотреть» на любом канале, чтобы начать трансляцию.</p>
    </div>

    <script>
        function loadChannel(url) {
            if (url) {
                document.getElementById('tv-frame').src = url;
                document.getElementById('placeholder-text').style.display = 'none';
            }
        }
    </script>

</body>
</html>
